services:
  db:
    image: postgres:17
    container_name: bookclub-db
    environment:
      POSTGRES_DB: bookclub
      POSTGRES_USER: bookclub
      POSTGRES_PASSWORD: ${BOOKCLUB_DB_PASSWORD}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bookclub -d bookclub"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
